<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Precios</title>
    <style>
        /* Estilo para el contenedor */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Estilo del campo de búsqueda */
        #searchInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Estilo de la lista */
        .product-listul {
            list-style-type: none;
            padding: 0;
        }

        .product-list li {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            display: block; /* Por defecto, los elementos están visibles */
        }

        h5 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    {% include 'layouts/navbar.html' %}
    
    <div class="container" style="margin-top: 90px !important">
        <h1>Lista de Precios</h1>

        <!-- Buscador -->
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar productos o servicios por nombre..."
        >

        <!-- Lista de productos -->
        <div class="product-list"> 
        <ul id="productList">
            {% for lista_precios in precios %}
            <li>
                <h5>{{ lista_precios.nombre }}</h5>
                <p><strong>Precio:</strong> ${{ lista_precios.precio }}</p>
            </li>
            {% endfor %}
        </ul>
        </div>
    </div>

    <script>
        // Filtro de búsqueda
        document.getElementById('searchInput').addEventListener('input', function () {
            const filter = this.value.toLowerCase(); // Texto ingresado
            const items = document.querySelectorAll('#productList li'); // Elementos de la lista

            // Recorrer cada elemento y filtrar
            items.forEach(item => {
                const name = item.querySelector('h5').textContent.toLowerCase(); // Texto del nombre
                if (name.includes(filter)) {
                    item.style.display = ''; // Mostrar si coincide
                } else {
                    item.style.display = 'none'; // Ocultar si no coincide
                }
            });
        });
    </script>
</body>

</html>
