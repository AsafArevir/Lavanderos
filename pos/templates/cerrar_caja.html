<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Abrir Caja</title>

    <!-- Agregar enlaces a Bootstrap y a tu archivo CSS personalizado -->
    <style>
        .mt-7, .my-7 {
            margin-top: 3.8rem !important;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .card-body img {
            max-width: 80px;
            max-height: 80px;
            float: right;
        }
        .arriba {
            margin-top: 100px;
        }

    </style>

</head>

<body>
    
    {%load static%}
    {% include 'layouts/navbar.html' %}
    <div class="arriba"></div>
    <h1>Cerrar Caja</h1>

    <!-- Contenido de la página -->
    <form id="formCerrarCaja" method="post" action="{% url 'cerrar_caja' %}">
        {% csrf_token %}
        <label for="saldoFinal">Saldo Final:</label>
        <input type="number" id="saldoFinal" name="saldo_final" step="0.01" required>
        <button type="submit">Cerrar Caja</button>
      </form>
      
      <script>
      document.getElementById('formCerrarCaja').addEventListener('submit', function(e) {
        e.preventDefault();
        const saldoFinal = document.getElementById('saldoFinal').value;
      
        if (saldoFinal > 0) {
          fetch('{% url "cerrar_caja" %}', {
            method: 'POST',
            headers: {
              'X-CSRFToken': '{{ csrf_token }}',
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `saldo_final=${saldoFinal}`,
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              alert(data.message);
              // Opcional: Redirigir o cerrar modal después de cerrar caja
            } else {
              alert(data.message);
            }
          });
        } else {
          alert('El saldo final debe ser mayor a 0');
        }
      });
      </script>      
      

</body>
</html>
